name: Build no95 shadow image

on:
  push:
    branches:
      - shadow-no95-fabric-20261115
    paths:
      - server.js
      - session_guard.js
      - smart_egress.py
      - shadow_entrypoint.py
      - authority_sync.py
      - telemetry_reporter.py
      - control_relay.py
      - Dockerfile.shadow
      - package.json
      - package-lock.json
      - tests/test_shadow_startup.py
      - tests/test_server_compat.js
      - .github/workflows/publish-no95-shadow.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'

      - name: Static checks
        run: |
          node --check server.js
          node --check session_guard.js
          python3 -m py_compile smart_egress.py shadow_entrypoint.py authority_sync.py telemetry_reporter.py control_relay.py
          python3 tests/test_shadow_startup.py
          npm ci --omit=dev
          node tests/test_server_compat.js

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.shadow
          push: true
          tags: ghcr.io/casperkocholo2002-a11y/slipnet-parspack-probe:no95-shadow-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/casperkocholo2002-a11y/SlipNet-ParsPack-Probe
            org.opencontainers.image.revision=${{ github.sha }}
            io.slipnet.role=no95-shadow
