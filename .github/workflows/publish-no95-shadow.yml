name: Publish no95 shadow

on:
  push:
    branches: [shadow/no95-emergency-v1]
    paths:
      - server.js
      - session_guard.js
      - Dockerfile.shadow
      - shadow/**
      - .github/workflows/publish-no95-shadow.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shadow
          push: true
          tags: |
            ghcr.io/casperkocholo2002-a11y/slipnet-parspack-probe:no95-shadow-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/casperkocholo2002-a11y/SlipNet-ParsPack-Probe
            org.opencontainers.image.description=SlipNet no95 emergency fabric shadow