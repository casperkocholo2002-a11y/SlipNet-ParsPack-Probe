name: Frankfurt standalone failover CI

on:
  push:
    branches:
      - frankfurt-standalone-failover-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.79.0
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Binary
        run: ls -lh target/release/slipnet-frankfurt-failover
