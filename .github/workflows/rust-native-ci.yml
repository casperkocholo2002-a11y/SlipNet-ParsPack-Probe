name: Rust native CI

on:
  push:
    branches:
      - native-rust-parspack-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Binary size
        run: ls -lh target/release/slipnet-parspack-rust
      - name: Upload lockfile and binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-native-build
          path: |
            Cargo.lock
            target/release/slipnet-parspack-rust