[package]
name = "slipnet-frankfurt-failover"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
axum = { version = "=0.7.9", features = ["ws"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "=1.38.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
